name: cmangos
services:
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: "${MYSQL_SUPERPASS}"

    networks:
      - default

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database:/etc/mysql/conf.d:ro

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  client-data:
    build:
      context: .
      target: client-data
      dockerfile: ./Dockerfile
      args:
        EXPANSION: "${WOW_VERSION}"

    environment:
      AUTO_CONFIRM: "true"

    volumes:
      - cmangos_mangosd_data:/home/mangos/data
      - ${WOW_CLIENT_DIR}:/home/mangos/wow-client:ro

    restart: "no"

  db-import:
    build:
      context: .
      target: db-import
      dockerfile: ./Dockerfile
      args:
        EXPANSION: "${WOW_VERSION}"

    environment:
      AUTO_CONFIRM: "true"
      MANGOS_DBHOST: mariadb
      MYSQL_SUPERUSER: root
      MYSQL_SUPERPASS: "${MYSQL_SUPERPASS}"
      MANGOS_DBUSER: "${MANGOS_DBUSER}"
      MANGOS_DBPASS: "${MANGOS_DBPASS}"

    depends_on:
      mariadb:
        condition: service_healthy

    volumes:
      - cmangos_mangosd_data:/home/mangos/data

    restart: "no"

  mangosd:
    depends_on:
      mariadb:
        condition: service_healthy
      client-data:
        condition: service_completed_successfully
      db-import:
        condition: service_completed_successfully

    build:
      context: .
      target: runner
      dockerfile: ./Dockerfile
      args:
        EXPANSION: "${WOW_VERSION}"

    environment:
      MANGOS_DBHOST: mariadb
      MANGOS_DBUSER: "${MANGOS_DBUSER}"
      MANGOS_DBPASS: "${MANGOS_DBPASS}"
      TZ: "${WOW_TIMEZONE}"

    command: mangosd
    stdin_open: true
    tty: true
    networks:
      - default

    ports:
      - "${MANGOSD_PORT:-8085}:8085"

    volumes:
      - cmangos_mangosd_data:/var/lib/mangos:ro
      - ./runner/config:/opt/mangos/conf:ro

  realmd:
    depends_on:
      mariadb:
        condition: service_healthy
      client-data:
        condition: service_completed_successfully
      db-import:
        condition: service_completed_successfully

    build:
      context: .
      target: runner
      dockerfile: ./Dockerfile
      args:
        EXPANSION: "${WOW_VERSION}"

    environment:
      MANGOS_DBHOST: mariadb
      MANGOS_DBUSER: "${MANGOS_DBUSER}"
      MANGOS_DBPASS: "${MANGOS_DBPASS}"
      TZ: "${WOW_TIMEZONE}"

    command: realmd
    networks:
      - default

    ports:
      - "${REALMD_PORT:-3724}:3724"

    volumes:
      - cmangos_mangosd_data:/var/lib/mangos:ro

  phpmyadmin:
    image: phpmyadmin:5.2
    depends_on:
      - mariadb

    profiles:
      - debug

    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: "${MYSQL_SUPERPASS}"

    networks:
      - default

    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"

networks:
  default:

volumes:
  mariadb_data:
  cmangos_mangosd_data:
    external: true
